[project]
name = "scottish-ballot-clustering-replication"
version = "0.1.0"
description = "Integer-program clustering of ranked election ballots"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "click>=8.1,<9",
    "gurobipy>=12.0.2,<13",
    "numpy>=2.3.1,<3",
    "votekit==3.3.1",
]

[dependency-groups]
dev = [
	"pyright>=1.1.332,<2",
	"ruff>=0.0.241,<1",
	"pytest>=9.1.1,<10",
]

[tool.ruff]
line-length = 100
src = ["code"]

[tool.pytest.ini_options]
testpaths = ["code/tests"]
pythonpath = ["code"]

[tool.pyright]
include = ["code"]
extraPaths = ["code"]
typeCheckingMode = "standard"

reportUnusedVariable = "warning"
reportUnusedImport = "warning"
reportUnusedFunction = "warning"
reportUnusedClass = "warning"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["code"]
include = ["scottish_ballot_clustering*"]
